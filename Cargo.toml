[package]
name = "gem-probe"
version = "0.1.0"
edition = "2021"
description = "Search the public GeM BidPlus feed for plaster and house-building bids"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "gzip", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
